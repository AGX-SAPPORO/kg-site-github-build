version: 0.2

phases:
  build:
    commands:
      - |
        set -eu

        : "${PREVIEW_BUCKET:?PREVIEW_BUCKET is required}"
        : "${CODEBUILD_BUILD_NUMBER:?CODEBUILD_BUILD_NUMBER is required}"
        : "${CODEBUILD_WEBHOOK_HEAD_REF:?CODEBUILD_WEBHOOK_HEAD_REF is required}"

        echo "Branch: ${CODEBUILD_WEBHOOK_HEAD_REF}"

        if [ "${CODEBUILD_WEBHOOK_HEAD_REF}" = "refs/heads/main" ]; then

          echo "Build microCMS preview artifact"

          preview_output="$(mktemp -d)"

          mkdir -p "$preview_output/preview"

          cp index.html "$preview_output/preview/template.html"

          for asset_directory in assets images fonts; do
            if [ -d "$asset_directory" ]; then
              mkdir -p "$preview_output/$asset_directory"
              cp -R "$asset_directory/." "$preview_output/$asset_directory/"
            fi
          done

          aws s3 sync "$preview_output/" \
            "s3://${PREVIEW_BUCKET}/releases/${CODEBUILD_BUILD_NUMBER}/" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

        elif [ "${CODEBUILD_WEBHOOK_HEAD_REF}" = "refs/heads/preview" ]; then

          echo "Build header/footer preview artifact"

          preview_output="$(mktemp -d)"

          cp index.html "$preview_output/index.html"

          for asset_directory in assets images fonts; do
            if [ -d "$asset_directory" ]; then
              mkdir -p "$preview_output/$asset_directory"
              cp -R "$asset_directory/." "$preview_output/$asset_directory/"
            fi
          done

          aws s3 sync "$preview_output/" \
            "s3://${PREVIEW_BUCKET}/layout-preview/" \
            --delete \
            --cache-control "no-cache" \
            --only-show-errors

        else

          echo "Unsupported branch: ${CODEBUILD_WEBHOOK_HEAD_REF}"
          exit 1

        fi