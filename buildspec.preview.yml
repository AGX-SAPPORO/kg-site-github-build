version: 0.2

phases:
  build:
    commands:
      - |
        set -eu

        : "${PREVIEW_BUCKET:?PREVIEW_BUCKET is required}"
        : "${CODEBUILD_WEBHOOK_HEAD_REF:?CODEBUILD_WEBHOOK_HEAD_REF is required}"

        echo "Branch: ${CODEBUILD_WEBHOOK_HEAD_REF}"

        output_dir="$(mktemp -d)"

        if [ "${CODEBUILD_WEBHOOK_HEAD_REF}" = "refs/heads/main" ]; then

          echo "Deploy main to latest/"

          mkdir -p "$output_dir/preview"

          # microCMSプレビュー用テンプレート
          cp index.html "$output_dir/preview/template.html"

          for asset_directory in assets images fonts; do
            if [ -d "$asset_directory" ]; then
              mkdir -p "$output_dir/$asset_directory"
              cp -R "$asset_directory/." "$output_dir/$asset_directory/"
            fi
          done

          aws s3 sync "$output_dir/" \
            "s3://${PREVIEW_BUCKET}/latest/" \
            --delete \
            --cache-control "no-cache" \
            --only-show-errors

        elif [ "${CODEBUILD_WEBHOOK_HEAD_REF}" = "refs/heads/preview" ]; then

          echo "Deploy preview branch to preview/"

          # CloudFrontから直接表示するためindex.htmlのまま配置
          cp index.html "$output_dir/index.html"

          for asset_directory in assets images fonts; do
            if [ -d "$asset_directory" ]; then
              mkdir -p "$output_dir/$asset_directory"
              cp -R "$asset_directory/." "$output_dir/$asset_directory/"
            fi
          done

          aws s3 sync "$output_dir/" \
            "s3://${PREVIEW_BUCKET}/preview/" \
            --delete \
            --cache-control "no-cache" \
            --only-show-errors

        else

          echo "Unsupported branch: ${CODEBUILD_WEBHOOK_HEAD_REF}"
          exit 1

        fi